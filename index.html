<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Priya Bhatia V1</title>
      <style>
          * {
              margin: 0;
            padding: 0;
            box-sizing: border-box;
}
        body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
}
        .container {
                      background: white;
            border-radius: 16px;
            padding: 60px 80px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
}
        h1 {
                      font-size: 3rem;
            color: #4a4a8a;
            margin-bottom: 10px;
            letter-spacing: 1px;
}
        .version {
                      font-size: 1rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
}
        .divider {
                      width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 30px;
            border-radius: 2px;
        }
        p {
                      color: #666;
            font-size: 1.1rem;
            line-height: 1.8;
}
    </style>
      </head>
      <body>
          <div class="container">
              <h1>Priya Bhatia</h1>
              <div class="version">Version 1</div>
              <div class="divider"></div>
              <p>Welcome to my page. This is version 1 of the Priya Bhatia website, published via GitHub Pages.</p>
          </div>
      </body>
      </html>
